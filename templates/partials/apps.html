{% set apps = get_section(path="apps/_index.md") %}
<ul class="dir">
  {% for page in apps.pages %}
  <li class="dir-item dir-item-app">
    <a class="dir-row" href="{{ page.permalink | safe }}">
      <span class="dir-name">{{ page.title }}</span>
      <span class="dir-desc">{{ page.description }}</span>
    </a>
    <span class="dir-actions">
      {% if page.extra.appstore %}<a href="{{ page.extra.appstore }}">app store</a>{% endif %}
      {% if page.extra.link %}<a href="{{ page.extra.link }}">{{ page.extra.link_label | default(value="source") | lower }}</a>{% endif %}
    </span>
  </li>
  {% endfor %}
</ul>
