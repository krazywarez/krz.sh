{% set apps = get_section(path="apps/_index.md") %}
<ul class="app-rows">
  {% for page in apps.pages %}
  <li{% if page.extra.tint %} style="--tint: {{ page.extra.tint }}"{% endif %}>
    <a class="app-row" href="{{ page.permalink | safe }}">
      {% set icon_class = "app-icon app-icon-xs" %}{% include "partials/app-icon.html" %}
      <span class="app-row-name">{{ page.title }}</span>
      <span class="app-row-desc">{{ page.extra.tagline | default(value=page.description) }}</span>
      <span class="app-row-go" aria-hidden="true">&rarr;</span>
    </a>
  </li>
  {% endfor %}
</ul>
<p class="dir-more"><a href="{{ apps.permalink | safe }}">all apps &rarr;</a></p>
