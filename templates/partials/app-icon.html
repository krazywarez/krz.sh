{% set p = icon_page | default(value=page) %}
{% if p.extra.icon %}
<img class="{{ icon_class | default(value="app-icon") }}" src="{{ p.extra.icon }}" alt="" width="1024" height="1024">
{% else %}
<span class="{{ icon_class | default(value="app-icon") }} app-icon-mono" aria-hidden="true">{{ p.title | truncate(length=1, end="") | upper }}</span>
{% endif %}
