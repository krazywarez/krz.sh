{% set p = icon_page | default(page) %}
{% if p.keywords.icon %}
<img class="{{ icon_class | default("app-icon") }}" src="{{ p.keywords.icon }}" alt="" width="1024" height="1024">
{% else %}
<span class="{{ icon_class | default("app-icon") }} app-icon-mono" aria-hidden="true">{{ p.title[:1] | upper }}</span>
{% endif %}
