{% import "data/services.html" as services %}
{% for group in services.groups %}
<div class="svc-group">
  <h3 class="sec-sub">{{ group.name }}</h3>
  <ul class="svc-cards">
    {% for item in group.items %}
    <li>
      <a class="svc-card" href="{{ item.url }}">
        <span class="svc-name">{{ item.name }}</span>
        <span class="svc-desc">{{ item.description }}</span>
        <span class="svc-host">{{ item.url | replace("https://", "") }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endfor %}
