<!DOCTYPE html>
<html lang="{{ lang | default(value="en") }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="{{ get_url(path="main.css", cachebust=true) | safe }}">
  <link rel="icon" href="{{ get_url(path="favicon.svg", cachebust=true) | safe }}">
  <link rel="apple-touch-icon" href="{{ get_url(path="apple-touch-icon.png", cachebust=true) | safe }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.title }}">
  <meta property="og:url" content="{{ current_url | default(value=config.base_url) | safe }}">
  <meta property="og:image" content="{{ get_url(path="og.png", cachebust=true) | safe }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ get_url(path="/") | safe }}">krz</a>
    <nav class="site-nav">
      <a href="{{ get_url(path="/services/") | safe }}">services</a>
      <span class="sep">·</span>
      <a href="{{ get_url(path="/apps/") | safe }}">apps</a>
    </nav>
  </header>

  <main class="site-main">
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <p class="foot-links"><a href="mailto:{{ config.extra.email }}">{{ config.extra.email }}</a> · <a href="https://git.krz.sh">git</a> · <a href="{{ get_url(path="/privacy/") | safe }}">privacy</a> · &copy; {{ now() | date(format="%Y") }} · public domain</p>
  </footer>
</body>
</html>
